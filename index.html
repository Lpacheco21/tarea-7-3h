<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Inventario Doméstico</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="contenedor">
    <h1>Inventario Doméstico</h1>

    <!-- Formulario para agregar productos -->
    <form id="formulario-producto">
      <h2>Agregar nuevo producto</h2>
      
      <div class="campo">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" placeholder="Ej. Trompeta">
      </div>

      <div class="campo">
        <label for="categoria">Categoría:</label>
        <input type="text" id="categoria" placeholder="Ej. Viento">
      </div>

      <div class="campo">
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" placeholder="Ej. 2">
      </div>

      <div class="campo">
        <label for="precio">Precio ($):</label>
        <input type="number" step="0.01" id="precio" placeholder="Ej. 120.00">
      </div>

      <button type="submit">Guardar Producto</button>
      <div id="mensaje-error" class="error"></div>
    </form>

    <!-- Filtro por categoría -->
    <div class="seccion-filtro">
      <label for="filtro-categoria">Filtrar por categoría:</label>
      <select id="filtro-categoria">
        <option value="todas">Todas</option>
      </select>
    </div>

    <!-- Indicadores de resumen -->
    <div class="indicadores">
      <div class="tarjeta">Total productos: <span id="total-productos">0</span></div>
      <div class="tarjeta">Total unidades: <span id="total-unidades">0</span></div>
      <div class="tarjeta">Valor total: $<span id="valor-total">0.00</span></div>
      <div class="tarjeta">Agotados: <span id="total-agotados">0</span></div>
    </div>

    <!-- Tabla de inventario -->
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Categoría</th>
          <th>Cantidad</th>
          <th>Precio</th>
          <th>Subtotal</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cuerpo-inventario">
        <!-- Las filas se cargan con JavaScript -->
      </tbody>
    </table>

    <!-- Mensaje cuando no hay resultados -->
    <div id="mensaje-vacio" class="oculto">No hay productos que mostrar en esta categoría.</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
